<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procvičování: Dny v týdnu francouzsky</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        h2 {
            color: #2c3e50;
            margin-top: 0;
            margin-bottom: 15px;
        }
        .tabs {
            display: flex;
            border-bottom: 2px solid #ecf0f1;
            margin-bottom: 20px;
        }
        .tab-btn {
            flex: 1;
            padding: 10px 5px;
            background: none;
            border: none;
            font-size: 0.9em;
            font-weight: bold;
            color: #7f8c8d;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
        }
        .tab-btn.active {
            color: #3498db;
            border-bottom-color: #3498db;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .vocab-list {
            text-align: left;
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 10px 15px;
            max-height: 250px;
            overflow-y: auto;
        }
        .vocab-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            border-bottom: 1px dashed #dee2e6;
        }
        .vocab-item:last-child {
            border-bottom: none;
        }
        .mode-select {
            margin-bottom: 20px;
        }
        select {
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #bdc3c7;
            font-size: 0.9em;
            outline: none;
            width: 100%;
        }
        .prompt-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
            min-height: 50px;
        }
        .prompt {
            font-size: 1.15em;
            font-weight: bold;
            color: #34495e;
        }
        .audio-btn {
            background: none;
            border: none;
            font-size: 1.2em;
            cursor: pointer;
            padding: 4px;
            border-radius: 50%;
            transition: transform 0.1s;
        }
        .audio-btn:hover {
            transform: scale(1.15);
        }
        input[type="text"] {
            width: 80%;
            padding: 10px;
            font-size: 1em;
            border: 2px solid #bdc3c7;
            border-radius: 6px;
            margin-bottom: 15px;
            text-align: center;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #3498db;
        }
        .submit-btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1em;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .submit-btn:hover {
            background-color: #2980b9;
        }
        .message {
            margin-top: 15px;
            font-weight: bold;
            min-height: 24px;
        }
        .correct { color: #27ae60; }
        .incorrect { color: #e74c3c; }
        .score {
            margin-top: 15px;
            font-size: 0.9em;
            color: #7f8c8d;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Dny v týdnu francouzsky</h2>

    <!-- Navigace záložek -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('list')">📖 Seznam</button>
        <button class="tab-btn" onclick="switchTab('words')">🔤 Slovíčka</button>
        <button class="tab-btn" onclick="switchTab('sentences')">💬 Věty</button>
    </div>

    <!-- ZÁLOŽKA 1: SEZNAM -->
    <div id="tab-list" class="tab-content active">
        <div class="vocab-list" id="vocabList"></div>
    </div>

    <!-- ZÁLOŽKA 2: PROCVIČOVÁNÍ SLOVÍČEK -->
    <div id="tab-words" class="tab-content">
        <div class="mode-select">
            <select id="modeSelectWords" onchange="generateWordQuestion()">
                <option value="translation">Překlad slovíček (CZ ➔ FR)</option>
                <option value="sequence">Posloupnost dnů (Následuje / Předchází / Uprostřed)</option>
                <option value="mixed">Smíšené procvičování</option>
            </select>
        </div>

        <div class="prompt-container">
            <div class="prompt" id="promptWord">Načítání...</div>
            <button class="audio-btn" title="Přehrát výslovnost" onclick="speakCurrentPrompt('words')">🔊</button>
        </div>
        
        <input type="text" id="userInputWords" placeholder="Napiš francouzsky..." autocomplete="off">
        <br>
        <button class="submit-btn" onclick="checkAnswer('words')">Zkontrolovat</button>
        
        <div class="message" id="messageWords"></div>
        <div class="score" id="scoreWords">Skóre: 0 / 0</div>
    </div>

    <!-- ZÁLOŽKA 3: PROCVIČOVÁNÍ VĚT -->
    <div id="tab-sentences" class="tab-content">
        <div class="prompt-container">
            <div class="prompt" id="promptSentence">Načítání...</div>
            <button class="audio-btn" title="Přehrát výslovnost" onclick="speakCurrentPrompt('sentences')">🔊</button>
        </div>
        
        <input type="text" id="userInputSentences" placeholder="Napiš: Nous sommes..." autocomplete="off">
        <br>
        <button class="submit-btn" onclick="checkAnswer('sentences')">Zkontrolovat</button>
        
        <div class="message" id="messageSentences"></div>
        <div class="score" id="scoreSentences">Skóre: 0 / 0</div>
    </div>
</div>

<script>
    const days = [
        { cz: "Pondělí", fr: "lundi" },
        { cz: "Úterý", fr: "mardi" },
        { cz: "Středa", fr: "mercredi" },
        { cz: "Čtvrtek", fr: "jeudi" },
        { cz: "Pátek", fr: "vendredi" },
        { cz: "Sobota", fr: "samedi" },
        { cz: "Neděle", fr: "dimanche" }
    ];

    const extraVocab = [
        { cz: "Týden", fr: "la semaine" }
    ];

    const sentences = days.map(day => ({
        cz: `Je ${day.cz.toLowerCase()}.`,
        fr: `Nous sommes ${day.fr}.`
    }));

    let currentWordQuestion = {};
    let currentSentenceQuestion = {};

    let scoreData = {
        words: { correct: 0, total: 0 },
        sentences: { correct: 0, total: 0 }
    };

    function switchTab(tabName) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

        if (tabName === 'list') {
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
            document.getElementById('tab-list').classList.add('active');
        } else if (tabName === 'words') {
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
            document.getElementById('tab-words').classList.add('active');
            generateWordQuestion();
        } else if (tabName === 'sentences') {
            document.querySelectorAll('.tab-btn')[2].classList.add('active');
            document.getElementById('tab-sentences').classList.add('active');
            generateSentenceQuestion();
        }
    }

    function initVocabList() {
        const container = document.getElementById("vocabList");
        container.innerHTML = "";

        // Slovíčka
        const allVocab = [...days, ...extraVocab];
        allVocab.forEach(item => {
            const div = document.createElement("div");
            div.className = "vocab-item";
            div.innerHTML = `
                <span><strong>${item.cz}</strong> = ${item.fr}</span>
                <button class="audio-btn" onclick="speakWord('${item.fr}')" title="Přehrát výslovnost">🔊</button>
            `;
            container.appendChild(div);
        });

        // Oddělovač
        const hr = document.createElement("hr");
        hr.style.margin = "10px 0";
        hr.style.border = "0";
        hr.style.borderTop = "1px solid #dee2e6";
        container.appendChild(hr);

        // Věty
        sentences.forEach(item => {
            const div = document.createElement("div");
            div.className = "vocab-item";
            div.innerHTML = `
                <span><strong>${item.cz}</strong> = ${item.fr}</span>
                <button class="audio-btn" onclick="speakWord('${item.fr}')" title="Přehrát výslovnost">🔊</button>
            `;
            container.appendChild(div);
        });
    }

    function speakWord(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'fr-FR';
            utterance.rate = 0.85;
            window.speechSynthesis.speak(utterance);
        }
    }

    function speakCurrentPrompt(type) {
        const q = type === 'words' ? currentWordQuestion : currentSentenceQuestion;
        if (q.speakText) {
            speakWord(q.speakText);
        }
    }

    function generateWordQuestion() {
        const selectedMode = document.getElementById("modeSelectWords").value;
        let mode = selectedMode;

        if (mode === "mixed") {
            mode = Math.random() < 0.5 ? "translation" : "sequence";
        }

        if (mode === "translation") {
            const allVocab = [...days, ...extraVocab];
            const item = allVocab[Math.floor(Math.random() * allVocab.length)];
            currentWordQuestion = {
                promptText: `Přelož: ${item.cz}`,
                correctAnswer: item.fr,
                speakText: item.fr
            };
        } else {
            const type = Math.floor(Math.random() * 3);
            const dayIndex = Math.floor(Math.random() * days.length);

            if (type === 0) {
                const nextIndex = (dayIndex + 1) % days.length;
                currentWordQuestion = {
                    promptText: `Který den následuje po: "${days[dayIndex].fr}"?`,
                    correctAnswer: days[nextIndex].fr,
                    speakText: days[dayIndex].fr
                };
            } else if (type === 1) {
                const prevIndex = (dayIndex - 1 + days.length) % days.length;
                currentWordQuestion = {
                    promptText: `Který den předchází dni: "${days[dayIndex].fr}"?`,
                    correctAnswer: days[prevIndex].fr,
                    speakText: days[dayIndex].fr
                };
            } else {
                const targetIndex = (dayIndex + 1) % days.length;
                const nextIndex = (dayIndex + 2) % days.length;
                currentWordQuestion = {
                    promptText: `Který den je mezi: "${days[dayIndex].fr}" a "${days[nextIndex].fr}"?`,
                    correctAnswer: days[targetIndex].fr,
                    speakText: `${days[dayIndex].fr} ${days[nextIndex].fr}`
                };
            }
        }

        document.getElementById("promptWord").innerText = currentWordQuestion.promptText;
        document.getElementById("userInputWords").value = "";
        document.getElementById("userInputWords").focus();
    }

    function generateSentenceQuestion() {
        const item = sentences[Math.floor(Math.random() * sentences.length)];
        currentSentenceQuestion = {
            promptText: `Přelož větu: "${item.cz}"`,
            correctAnswer: item.fr,
            speakText: item.fr
        };

        document.getElementById("promptSentence").innerText = currentSentenceQuestion.promptText;
        document.getElementById("userInputSentences").value = "";
        document.getElementById("userInputSentences").focus();
    }

    // Pomocná funkce na vyčištění textu pro porovnání (ignoruje velikost písmen a tečku na konci)
    function normalizeText(text) {
        return text.trim().toLowerCase().replace(/\.$/, "");
    }

    function checkAnswer(type) {
        const isWords = type === 'words';
        const inputId = isWords ? "userInputWords" : "userInputSentences";
        const messageId = isWords ? "messageWords" : "messageSentences";
        const scoreId = isWords ? "scoreWords" : "scoreSentences";
        const q = isWords ? currentWordQuestion : currentSentenceQuestion;

        const rawInput = document.getElementById(inputId).value;
        if (!rawInput.trim()) return;

        const cleanedInput = normalizeText(rawInput);
        const cleanedAnswer = normalizeText(q.correctAnswer);
        const messageEl = document.getElementById(messageId);

        scoreData[type].total++;

        if (cleanedInput === cleanedAnswer) {
            scoreData[type].correct++;
            messageEl.innerText = "Správně! 🎉";
            messageEl.className = "message correct";
            speakWord(q.correctAnswer);

            setTimeout(() => {
                messageEl.innerText = "";
                if (isWords) generateWordQuestion();
                else generateSentenceQuestion();
            }, 1200);
        } else {
            messageEl.innerText = `Chyba! Správně je: ${q.correctAnswer}`;
            messageEl.className = "message incorrect";
            speakWord(q.correctAnswer);
        }

        document.getElementById(scoreId).innerText = `Skóre: ${scoreData[type].correct} / ${scoreData[type].total}`;
    }

    document.getElementById("userInputWords").addEventListener("keypress", function(event) {
        if (event.key === "Enter") checkAnswer('words');
    });

    document.getElementById("userInputSentences").addEventListener("keypress", function(event) {
        if (event.key === "Enter") checkAnswer('sentences');
    });

    // Inicializace
    initVocabList();
</script>

</body>
</html>
